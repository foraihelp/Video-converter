<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" />
    </clipPath>
    <linearGradient id="gradA" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#6C5CE7" />
      <stop offset="1" stop-color="#4F8CFF" />
    </linearGradient>
    <linearGradient id="gradB" x1="1024" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#22C1C3" />
      <stop offset="1" stop-color="#1EA7E0" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1030" flood-opacity="0.35" />
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="#1b1d22" />
    <polygon points="0,0 1024,0 0,1024" fill="url(#gradA)" />
    <polygon points="1024,0 1024,1024 0,1024" fill="url(#gradB)" />
    <line x1="1024" y1="0" x2="0" y2="1024" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" />
  </g>

  <g filter="url(#softShadow)">
    <circle cx="512" cy="512" r="196" fill="#ffffff" fill-opacity="0.14" />
    <polygon points="452,378 452,646 684,512" fill="#ffffff" />
  </g>
</svg>
